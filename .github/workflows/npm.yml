name: npm package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: CLI tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  smoke:
    name: npx smoke test (packed tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pack
        run: echo "TARBALL=$GITHUB_WORKSPACE/$(npm pack --silent)" >> "$GITHUB_ENV"
      - name: Install into a fresh iOS project and verify
        run: |
          app="$(mktemp -d)"
          touch "$app/Package.swift"
          cd "$app"
          npx --yes --package "$TARBALL" mobie init --tool all
          npx --yes --package "$TARBALL" mobie doctor
          npx --yes --package "$TARBALL" mobie update

  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Check tag matches package.json version
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")" ] \
            || { echo "Tag $GITHUB_REF_NAME does not match package.json version"; exit 1; }
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
